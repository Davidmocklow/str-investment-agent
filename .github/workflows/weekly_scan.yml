name: Weekly STR Scan

on:
  schedule:
    # Every Monday at 9:00am EST (14:00 UTC)
    - cron: '0 14 * * 1'
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write   # needed to commit scan output back to repo

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run weekly scan
        env:
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: python run_weekly_scan.py

      - name: Commit scan output
        run: |
          git config user.name  "STR Agent"
          git config user.email "str-agent@noreply.github.com"
          git add data/weekly_report.json data/scan_history/ data/alert_history.json || true
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: weekly STR scan $(date +%Y-%m-%d)" && git push
